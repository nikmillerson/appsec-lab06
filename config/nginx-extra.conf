worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 128;
}

http {
    access_log /dev/stdout combined;

    server {
        listen 18080;
        server_name _;

        location / {
            default_type text/plain;
            return 200 "lab06 extra web is running\n";
        }
    }
}
