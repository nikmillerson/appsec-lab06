services:
  web:
    image: nginx:alpine@sha256:785835ea65db4bba6f021acc0f3be91b0fef76a53fe41f8588c6698d2aed0606
    user: nginx
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:18080:18080"
    volumes:
      - ./config/nginx-extra-fixed.conf:/etc/nginx/nginx.conf:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    restart: "on-failure:5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:18080/health
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - app_net

networks:
  app_net:
    driver: bridge

